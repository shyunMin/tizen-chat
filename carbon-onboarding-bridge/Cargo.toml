[package]
name    = "carbon-onboarding-bridge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "carbon-onboarding-bridge"
path = "src/main.rs"

[dependencies]
tokio       = { version = "1", features = ["full"] }
tonic       = "0.12"
prost       = "0.13"
serde       = { version = "1", features = ["derive"] }
serde_yaml  = "0.9"
anyhow      = "1"
tokio-stream = "0.1"

[build-dependencies]
tonic-build = "0.12"
